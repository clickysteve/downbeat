# Test DOWNBEAT on every push and pull request: types, unit tests, build,
# then the browser tests in Chromium with a simulated MIDI device.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: 'true'
